<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodexHub · 原图对照描摹</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#282536;font:14px/1.6 system-ui;padding:28px}h1{font-size:20px;margin:0}p{color:#858092}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:16px;background:white;border:1px solid #e4dfec;border-radius:12px}.card h2{font-size:14px;margin:0 0 12px}img{width:100%;display:block}.overlay{position:relative}.overlay img+img{position:absolute;inset:0}nav{display:flex;gap:8px;align-items:center;margin:20px 0}button{font:inherit;color:#51435f;background:white;border:1px solid #d9d0e2;border-radius:8px;padding:6px 14px;cursor:pointer}button[aria-pressed=true]{background:#8971a7;color:white}.sizes{display:flex;align-items:center;gap:24px;padding:20px}.sizes img{flex:none}.sizes img[width="24"]{width:24px}.sizes img[width="32"]{width:32px}.sizes img[width="48"]{width:48px}.sizes img[width="64"]{width:64px}small{color:#858092}@media(max-width:650px){main{grid-template-columns:1fr}}</style>
<h1>严格对照原图 · SVG 描摹版</h1><p>外围模块、中央底形和留白按原图轮廓描摹；只减轻立方体分界线。此版已确认，已统一应用到界面与打包图标。</p>
<nav><button data-mode="svg" aria-pressed="true">SVG</button><button data-mode="original" aria-pressed="false">原图</button><button data-mode="overlay" aria-pressed="false">50% 叠加检查</button></nav>
<main><section class="card"><h2>选定原图</h2><img src="theme-flat-b.png" alt="选定的灰紫色原图"></section><section class="card"><h2 id="mode-title">轮廓描摹 SVG</h2><div class="overlay"><img src="theme-flat-b.png" alt="原图底层"><img id="vector" src="reference-aligned-b.svg?v=2" alt="与原图对齐的 SVG"></div></section></main>
<div class="sizes"><small>SVG 小尺寸</small><img src="reference-aligned-b.svg?v=2" width="24"><img src="reference-aligned-b.svg?v=2" width="32"><img src="reference-aligned-b.svg?v=2" width="48"><img src="reference-aligned-b.svg?v=2" width="64"></div>
<script>for(const button of document.querySelectorAll('button[data-mode]'))button.addEventListener('click',()=>{const mode=button.dataset.mode;document.getElementById('vector').style.opacity=mode==='original'?'0':mode==='overlay'?'.5':'1';document.getElementById('mode-title').textContent=mode==='original'?'原图':mode==='overlay'?'50% 叠加：检查边缘是否重合':'轮廓描摹 SVG';for(const other of document.querySelectorAll('button[data-mode]'))other.setAttribute('aria-pressed',String(other===button));});</script></html>
