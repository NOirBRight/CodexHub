<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>CodexHub ChatGPT</title>
<link rel="stylesheet" href="popup.css"></head><body>
<h1>连接当前浏览器的 ChatGPT</h1>
<p>先在此浏览器登录 ChatGPT，再回到 CodexHub 的 Runtime Settings 页面，点击下方按钮。</p>
<p>仅将 ChatGPT 会话交给本机组件；不读取 Google 密码、Passkey 或其他网站的登录资料。</p>
<button id="connect" type="button">连接此浏览器的 ChatGPT 账号</button>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="popup.js"></script></body></html>
