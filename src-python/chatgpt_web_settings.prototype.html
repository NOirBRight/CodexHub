<!doctype html>
<!-- THROWAWAY: Three structurally different coding setup wizards on the standalone
     settings route /?variant=A|B|C. Question: which layout makes the next action and
     external-page handoff clearest? All state and outcomes are simulated in memory. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT 编程设置 · 交互原型</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#111514;--panel:#1b201e;--line:#363f3b;--muted:#a4b0a9;--accent:#97e8bc;--ink:#eef6f1;--warn:#f6d18a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button,select{cursor:pointer}button{padding:10px 16px;border:1px solid var(--line);border-radius:9px;background:transparent;color:inherit}button:hover:not(:disabled){background:#2a3630}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--accent);color:#11291d;border-color:var(--accent);font-weight:650}button.secondary{background:#26332d}button.small{padding:5px 10px;font-size:13px}a{color:var(--accent)}p{margin:8px 0;color:var(--muted)}h1{font-size:clamp(25px,3.3vw,37px);line-height:1.3;margin:10px 0}h2{font-size:23px;line-height:1.4;margin:0 0 12px}h3{font-size:16px;margin:0}small,.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:1.4px;color:var(--accent)}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:#293b31;color:var(--accent);font-size:12px}.badge.warn{background:#473b26;color:var(--warn)}.prototype-banner{padding:10px 20px;text-align:center;color:#f0d6a4;background:#31291b;font-size:13px}.shell{max-width:1180px;margin:auto;padding:28px 24px 140px}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.mark{border:1px solid var(--line);width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.heading{margin:22px 0 26px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:25px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.notice{border-left:3px solid var(--accent);padding:12px 15px;background:#223129;margin:18px 0}.notice.warn{border-color:var(--warn);background:#332d22}.notice.error{border-color:#f4a6a2;background:#372827}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:13px;font-weight:650}.field input{width:100%;border:1px solid var(--line);border-radius:8px;background:#111815;color:var(--muted);padding:11px 12px}ol{padding-left:23px;color:var(--muted)}li+li{margin-top:8px}.place{color:var(--accent);font-size:13px;margin-bottom:15px}.sim-action{border:1px dashed #657367;padding:13px 15px;border-radius:9px;margin-top:18px;font-size:13px;color:var(--muted)}.sim-action button{margin-top:8px}.done-title{color:var(--accent)}.toast{padding:13px 16px;background:#253b2e;border-radius:10px;margin-bottom:18px}.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}
/* A: one focused task, no full form on screen. */
.focus{max-width:790px;margin:auto}.focus .heading{text-align:center}.dots{display:flex;justify-content:center;gap:10px;margin:25px 0}.dots button{border-radius:30px;padding:7px 12px;font-size:12px}.dots .current{border-color:var(--accent);color:var(--accent)}.focus-card{padding:34px 38px;min-height:370px}.focus-meta{display:flex;justify-content:space-between;margin-bottom:20px;font-size:13px;color:var(--muted)}.focus-foot{display:flex;justify-content:space-between;gap:15px;margin-top:18px;font-size:13px;color:var(--muted)}
/* B: a whole-journey checklist with one expanded working row. */
.overview{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px}.overview .heading{grid-column:1/-1;margin-bottom:0}.timeline{border-top:1px solid var(--line)}.journey-row{border-bottom:1px solid var(--line);padding:20px 0}.row-head{display:flex;align-items:center;gap:15px;width:100%;text-align:left;border:none;padding:0}.number{width:30px;height:30px;border-radius:50%;background:#2c3530;display:grid;place-items:center;flex-shrink:0}.number.done{background:#254331;color:var(--accent)}.row-head .label{flex:1}.row-body{padding:20px 0 8px 45px}.row-body h2{display:none}.overview aside{align-self:start;position:sticky;top:24px;padding:20px;border-left:2px solid var(--accent)}.summary-list{list-style:none;padding:0;font-size:13px}.summary-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
/* C: explicit handoff between this page and the outside app/browser. */
.handoff{display:grid;grid-template-columns:minmax(300px,.95fr) minmax(330px,1.1fr);gap:24px}.handoff .heading{grid-column:1/-1}.handoff-nav{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}.handoff-nav button{font-size:12px;padding:6px 11px}.handoff-nav .current{border-color:var(--accent);color:var(--accent)}.browser-frame{border:1px solid #4a524e;border-radius:15px;overflow:hidden;align-self:start;background:#eef1ee;color:#26382c;position:sticky;top:20px}.browser-toolbar{display:flex;gap:7px;background:#333d36;color:#c0c8c2;padding:12px;font-size:12px}.browser-toolbar span{background:#202a23;border-radius:6px;padding:3px 11px;flex:1}.outside{padding:28px}.outside p,.outside small{color:#647468}.outside .example{border:1px solid #c8d4ca;padding:13px;border-radius:9px;margin:15px 0;background:white}.outside .badge{background:#d7e9dc;color:#336443}.outside button{color:#264d34;border-color:#bbcdbf}.outside .notice{background:#dceadf;color:#31563a}.outside code{font-size:13px}.outside .mock-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#748379}.browser-caption{padding:14px;background:#dce3dd;color:#55665b;font-size:12px}.handoff .panel{padding:25px}.handoff .sim-action{border-color:#82978b}
/* Deliberately separate prototype controls, shared across layouts. */
.switcher{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;border:1px solid #6e7e72;border-radius:40px;background:#e7f3e9;color:#183121;box-shadow:0 10px 35px #0008;padding:7px 10px;white-space:nowrap}.switcher button{border:none;color:#183121;padding:7px 11px;border-radius:30px}.switcher button:hover{background:#cce4d2!important}.switcher select{background:transparent;color:#183121;border:none;max-width:230px}.lab{position:fixed;right:18px;bottom:85px;z-index:25;width:min(430px,calc(100vw - 36px));max-height:70vh;overflow:auto;background:#111c17;border:1px solid #698576;padding:20px;border-radius:15px;box-shadow:0 12px 50px #0009}.lab[hidden]{display:none}.lab label{display:block;margin-top:12px}.lab select{width:100%;padding:9px;background:#25322a;border:1px solid #53685a;color:inherit;border-radius:7px}.lab pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:#b3c9bb}.lab .actions{margin-top:12px}dialog{max-width:640px;width:calc(100vw - 32px);background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:18px;padding:25px}dialog::backdrop{background:#0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.dialog-head h2{font-size:20px;margin:0}.dialog-body{margin-top:20px}.error-view{padding:40px}.subtitle{max-width:780px}.completed{padding:40px;text-align:center}.completed .checkmark{font-size:38px;color:var(--accent)}.variant-hint{font-size:12px;margin-top:10px;color:#82968a}
@media(max-width:760px){.shell{padding:20px 16px 145px}.overview,.handoff{grid-template-columns:1fr}.overview .heading,.handoff .heading,.handoff-nav{grid-column:1}.overview aside{position:static;border-left:0;border-top:1px solid var(--line)}.browser-frame{position:static}.focus-card{padding:23px}.dots{gap:5px}.dots button{padding:6px 9px}.dots .dot-name{display:none}.switcher{max-width:calc(100vw - 20px);gap:1px;padding:6px}.switcher select{max-width:170px}.switcher button{padding:7px 9px}.topline{align-items:flex-start}.row-body{padding-left:0}.focus-foot{display:block}}
</style>
</head>
<body>
<div class="prototype-banner">交互原型 · 所有账号、凭证、重启与工具结果均为模拟；不连接真实服务，不保存配置。</div>
<main id="app"></main><div id="prototype-controls"></div><aside id="lab" class="lab" hidden></aside>
<dialog id="outside-dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button data-action="close-dialog" aria-label="关闭演示窗口">✕</button></div><div id="dialog-body" class="dialog-body"></div></dialog>
<script>
(() => {
  if ('__PROTOTYPE_DEV__' !== 'enabled') { document.getElementById('app').innerHTML='<p class="error-view">这是独立开发原型。请在 frontend 运行 npm run prototype:chatgpt-setup。</p>'; return; }
  const variants={A:'单步聚焦',B:'全程清单',C:'双侧协作'};
  const titles=['连接账号','准备工具通道','启用工具通道','授权 ChatGPT 工具','验证编程能力'];
  const short=['账号','通道','启用','授权','验证'];
  const descriptions=['连接日常浏览器中的 ChatGPT 登录账号','准备 Tunnel ID 与普通 API key','保存后手动重启，再检查是否真正运行','在 ChatGPT 中连接对应 Tunnel','验证工具请求与结果能完成往返'];
  const scenarios={existing:'已有账号 · 首次设置工具',fresh:'全新设备 · 尚未登录',saved:'凭证已保存 · 等待手动重启',blocked:'工作区限制 · 无法授权工具',failed:'工具往返失败 · 不能完成',expired:'登录过期 · 保留旧配置'};
  let variant=new URLSearchParams(location.search).get('variant') || 'A'; if(!variants[variant]) variant='A';
  let state,step,scenario='existing',toast='',labOpen=false,busy=false,failProbe=false,probeTimer;
  const $=id=>document.getElementById(id);
  function reset(name){
    clearTimeout(probeTimer);scenario=name;toast='';busy=false;failProbe=name==='failed';
    state={accountConnected:name!=='fresh'&&name!=='expired',extensionInstalled:name!=='fresh',tunnelPrepared:false,apiKeyPrepared:false,credentialsSaved:false,fullRuntimeRunning:false,connectorAuthorized:false,toolRoundtrip:'not-run',manualRestartSimulated:false,workspaceBlocked:name==='blocked'};
    if(['saved','blocked','failed','expired'].includes(name)) Object.assign(state,{tunnelPrepared:true,apiKeyPrepared:true,credentialsSaved:true});
    if(['blocked','failed'].includes(name)) Object.assign(state,{manualRestartSimulated:true,fullRuntimeRunning:true});
    if(name==='failed') Object.assign(state,{connectorAuthorized:true,toolRoundtrip:'failed'});
    step=firstPending();render();
  }
  function completed(i){return [state.accountConnected,state.credentialsSaved,state.fullRuntimeRunning,state.connectorAuthorized,state.toolRoundtrip==='passed'][i];}
  function firstPending(){const index=titles.findIndex((_,i)=>!completed(i));return index===-1?5:index;}
  function progress(){return titles.filter((_,i)=>completed(i)).length;}
  function button(action,label,primary=false,disabled=false){return `<button data-action="${action}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${label}</button>`;}
  function header(hint){return `<div class="topline"><div class="brand"><span class="mark">CH</span>CodexHub <span class="muted">/ ChatGPT</span></div><span class="badge">外部设置向导</span></div><div class="heading"><div class="eyebrow">让 ChatGPT 参与真正的编程</div><h1>连接账号，也连接工具。</h1><p class="subtitle">完成后回到 CodexHub 选择模型和编程客户端。这里处理账号、工具通道与授权。</p><p class="variant-hint">${hint}</p></div>`;}
  function StepContent(i){
    if(i===0)return `<div class="place">操作位置：你的日常浏览器</div><h2>连接已有的 ChatGPT 账号</h2><p>继续使用日常浏览器里的 Google / Passkey。有效登录可以复用，不需要另开一套账号。</p>${state.accountConnected?'<div class="notice">已检测到连接的账号，这一步可以跳过。</div>':`<ol><li>首次使用，在日常浏览器安装账号连接扩展。</li><li>在同一浏览器资料中登录 ChatGPT。</li><li>返回这个设置页，通过扩展连接账号。</li></ol><p class="muted">扩展负责连接登录会话；稍后的 ChatGPT 连接器负责工具调用，两者不同。</p>`}<div class="actions">${state.accountConnected?button('next','继续准备工具通道',true):button('account-dialog','连接浏览器账号',true)}</div>`;
    if(i===1)return `<div class="place">操作位置：OpenAI 平台 → 返回本页</div><h2>先准备工具回到本机的通道</h2><p>Tunnel 把 ChatGPT 的工具请求送回编程客户端。使用与 ChatGPT 相同的 OpenAI 账号。</p><div class="actions">${button('tunnel-dialog','① 创建 / 选择 Tunnel')}${button('key-dialog','② 创建普通 API key')}</div><div class="field"><label>Tunnel ID</label><input readonly aria-label="演示 Tunnel ID" value="${state.tunnelPrepared?'tunnel_demo_workspace':''}" placeholder="从 Tunnels 页面复制 · 原型不接收真实凭证"></div><div class="field"><label>用于 Tunnel 的普通 API key</label><input readonly aria-label="演示 API key" value="${state.apiKeyPrepared?'•••••••• · 演示值':''}" placeholder="不是 Admin key；权限为 Tunnels Read + Use"><small>${state.credentialsSaved?'已保存，保留即可，不需要再次输入。':'仅用于工具通道，不是 ChatGPT Cookie，也不是 CodexHub 服务凭证。'}</small></div><p>先保存，再手动重启组件。保存本身不会启动通道。</p><div class="actions">${button('save','保存工具通道配置',true,!state.tunnelPrepared||!state.apiKeyPrepared)}</div>`;
    if(i===2)return `<div class="place">操作位置：CodexHub 主界面 → 返回本页</div><h2>让已保存的配置真正生效</h2><div class="notice warn">配置已保存。请在 CodexHub 手动停止再启动 <strong>ChatGPT 组件</strong>。</div><p>仅刷新这个网页不会重启组件。保持组件运行后，再去 ChatGPT 创建工具连接器。</p><div class="actions">${button('restart-help','查看手动重启位置')}${button('check-runtime','重新检查组件状态',true)}</div><p><small>可以关闭页面稍后继续；保存操作不会在后台等候或自动重启。</small></p><div class="sim-action">原型演示操作，不属于正式产品按钮。<br>${button('simulate-restart',state.manualRestartSimulated?'演示：已手动重启':'模拟：我已在 CodexHub 手动重启',false,state.manualRestartSimulated)}</div>`;
    if(i===3)return `<div class="place">操作位置：ChatGPT → 返回本页</div><h2>允许 ChatGPT 使用编程工具</h2><p>通道已运行。现在在 ChatGPT 里创建与它对应的工具连接器。</p><ol><li>设置中开启 <strong>Developer Mode</strong>。</li><li>新建连接器，类型选 <strong>Tunnel</strong>，选择刚才的 Tunnel。</li><li>Authentication 选 <strong>None</strong>，名称填写 <strong>Codex Native2</strong>。</li><li>按上游完整工具流程，在 Permissions 中确认 <strong>Allow all actions</strong>。</li></ol><p><small>请了解授权范围。客户端的沙箱与审批仍然生效；工作区策略也可能禁止这些权限。</small></p>${state.workspaceBlocked?'<div class="notice error">演示场景：工作区禁止所需工具权限。请由管理员确认策略；不能将文本可用标记为设置完成。</div>':''}<div class="actions">${button('connector-dialog','打开 ChatGPT 授权步骤',true)}</div>`;
    return `<div class="place">操作位置：本页检查 → 返回 CodexHub</div><h2>最后，确认工具能完成一次往返</h2><p>不仅是登录成功：编程能力需要工具请求到达客户端，并把结果送回同一次模型交互。</p><div class="notice">正式实现应使用无副作用的真实工具探测。本原型仅模拟检查过程，不能作为账号或工具验收证据。</div>${state.toolRoundtrip==='failed'?'<div class="notice error">模拟结果：文本连接正常，但工具结果没有返回。设置尚未完成。请检查通道、连接器与客户端工具权限，再重试。</div>':''}<div class="actions">${button('verify',busy?'正在模拟工具往返…':state.toolRoundtrip==='failed'?'重新验证（模拟）':'验证编程能力（模拟）',true,busy)}${button('return-auth','返回核对授权')}</div>`;
  }
  function Done(){return `<section class="panel completed"><div class="checkmark">✓</div><span class="badge">模拟结果 · 非真实验收</span><h1>编程工具已就绪</h1><p>账号、运行中的通道、连接器和工具往返均完成了本次模拟。</p><p>下一步：回到 CodexHub，选择模型并接入你的编程客户端。</p><div class="actions" style="justify-content:center">${button('return-app','返回 CodexHub（演示）',true)}${button('review','查看设置')}</div></section>`;}
  function nav(className){return `<nav class="${className}" aria-label="设置进度">${titles.map((title,i)=>`<button data-step="${i}" class="${step===i?'current':''}" ${i>firstPending()?'disabled':''}><span>${completed(i)?'✓':i+1}</span> <span class="dot-name">${short[i]}</span></button>`).join('')}</nav>`;}
  function VariantA(){return `<div class="shell focus">${header('A · 一次只处理一个任务；优先突出当前动作。')}${nav('dots')}${toast?`<div class="toast" role="status">${toast}</div>`:''}${step===5?Done():`<section class="panel focus-card"><div class="focus-meta"><span>第 ${step+1} 步，共 5 步</span><span>${progress()} 项已完成</span></div>${StepContent(step)}</section>`}<div class="focus-foot"><span>更改账号或连接配置后，需要重新验证相关步骤。</span>${step>0&&step<5?button('back','上一步'):''}</div></div>`;}
  function VariantB(){return `<div class="shell overview">${header('B · 全程清单；看清剩余步骤，直接回到未完成的位置。')}<div>${toast?`<div class="toast" role="status">${toast}</div>`:''}${step===5?Done():''}<div class="timeline">${titles.map((title,i)=>`<section class="journey-row"><button class="row-head" data-step="${i}" ${i>firstPending()?'disabled':''}><span class="number ${completed(i)?'done':''}">${completed(i)?'✓':i+1}</span><span class="label"><strong>${title}</strong><br><small>${descriptions[i]}</small></span><span class="badge ${i===step?'warn':''}">${completed(i)?'已完成':i>firstPending()?'等待前一步':i===step?'进行中':'待处理'}</span></button>${step===i?`<div class="row-body">${StepContent(i)}</div>`:''}</section>`).join('')}</div></div><aside><h3>目标：完整编程能力</h3><p>不是“能回复文本”就结束。</p><div class="progress"><span style="width:${progress()*20}%"></span></div><ul class="summary-list">${titles.map((title,i)=>`<li><span>${title}</span><span>${completed(i)?'✓':'待完成'}</span></li>`).join('')}</ul><p><small>保存和重启分开处理。已保存的密钥无需重复填写。</small></p></aside></div>`;}
  function OutsideView(){
    if(step===0)return `<div class="mock-label">浏览器外部页面示意</div><h2>ChatGPT</h2><p>沿用日常浏览器的 Google / Passkey。</p><div class="example"><strong>登录与连接是两个动作</strong><p>在 ChatGPT 登录后，返回本机设置页点击账号连接扩展。</p></div>${button('account-dialog','演示账号连接交接')}`;
    if(step===1)return `<div class="mock-label">OpenAI 平台示意 · 不是真实页面</div><h2>工具连接凭证</h2><div class="example"><strong>Tunnels</strong><p>${state.tunnelPrepared?'✓ 已选择演示 Tunnel':'创建或选择同账号下的 Tunnel'}</p>${button('tunnel-dialog','演示选择 Tunnel')}</div><div class="example"><strong>API keys</strong><p>${state.apiKeyPrepared?'✓ 演示权限：Tunnels Read + Use':'普通 API key，非 Admin key'}</p>${button('key-dialog','演示创建 API key')}</div><small>回到左侧保存。这一步不启动组件。</small>`;
    if(step===2)return `<div class="mock-label">CodexHub 主界面示意</div><h2>ChatGPT 组件</h2><div class="example"><strong>${state.manualRestartSimulated?'已手动重新启动（模拟）':'配置等待重启生效'}</strong><p>高级操作 → 停止组件 → 启动组件</p></div><p>这是用户在主界面执行的操作，不由设置页保存动作触发。</p>${button('simulate-restart','模拟：已在主界面手动重启',false,state.manualRestartSimulated)}<div class="notice">然后回到左侧，重新检查组件状态。</div>`;
    if(step===3)return `<div class="mock-label">ChatGPT 设置示意 · 不是真实页面</div><h2>新建工具连接器</h2><div class="example"><small>类型</small><p><strong>Tunnel</strong></p><small>名称</small><p><strong>Codex Native2</strong></p><small>Authentication</small><p><strong>None</strong></p><small>Permissions</small><p><strong>Allow all actions</strong></p></div>${button('connector-dialog','演示授权并返回')}`;
    return `<div class="mock-label">工具往返示意</div><h2>一个请求，一份结果。</h2><div class="example"><p>ChatGPT 工具请求</p><p>↓ Tunnel / connector</p><p>客户端执行无副作用探测</p><p>↑ 返回同一次交互</p></div><span class="badge">${state.toolRoundtrip==='passed'?'模拟通过':state.toolRoundtrip==='failed'?'模拟失败':'等待验证'}</span><p>登录或文本成功不能替代这一步。</p>`;
  }
  function VariantC(){return `<div class="shell handoff">${header('C · 双侧协作；左边是当前任务，右边解释接下来在哪个页面操作。')}${nav('handoff-nav')}<div>${toast?`<div class="toast" role="status">${toast}</div>`:''}${step===5?Done():`<section class="panel">${StepContent(step)}</section>`}</div><section class="browser-frame"><div class="browser-toolbar">● ● ● <span>${step===1?'OpenAI 平台':step===2?'CodexHub 主界面':step===0||step===3?'日常浏览器 · ChatGPT':'工具验证流程'} · 示意</span></div><div class="outside">${OutsideView()}</div><div class="browser-caption">右侧是说明性交接预览，不连接任何真实账号或服务。</div></section></div>`;}
  function PrototypeSwitcher(){return `<div class="switcher" aria-label="原型方案切换"><button data-action="previous-variant" aria-label="上一个方案">←</button><select id="variant" aria-label="原型方案">${Object.entries(variants).map(([key,label])=>`<option value="${key}" ${key===variant?'selected':''}>${key} · ${label}</option>`).join('')}</select><button data-action="next-variant" aria-label="下一个方案">→</button><button data-action="lab">场景 / 状态</button></div>`;}
  function render(){
    $('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])();$('prototype-controls').innerHTML=PrototypeSwitcher();
    $('lab').hidden=!labOpen;$('lab').innerHTML=`<div class="topline"><strong>原型控制台</strong><button data-action="lab" class="small">收起</button></div><small>不是正式产品界面。刷新页面会重置模拟状态。</small><label for="scenario">起始场景</label><select id="scenario">${Object.entries(scenarios).map(([key,label])=>`<option value="${key}" ${scenario===key?'selected':''}>${label}</option>`).join('')}</select><label for="probe-outcome">工具验证模拟结果</label><select id="probe-outcome"><option value="pass" ${!failProbe?'selected':''}>通过</option><option value="fail" ${failProbe?'selected':''}>失败（不能完成）</option></select><div class="actions">${button('reset','重置当前场景')}${state.workspaceBlocked?button('unblock','解除模拟工作区限制'):''}</div><details open><summary>完整相关状态（模拟）</summary><pre>${JSON.stringify({variant,scenario,viewedStep:step+1,firstIncompleteStep:firstPending()+1,busy,simulatedProbeOutcome:failProbe?'failed':'passed',...state},null,2)}</pre></details>`;
    console.info('ChatGPT setup prototype state',{variant,scenario,step,...state});
  }
  function switchVariant(direction){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+direction+keys.length)%keys.length]);}
  function setVariant(value){variant=value;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render();}
  function openDialog(kind){
    const copy={
      account:['演示：连接日常浏览器账号',`<p>真实流程中，在日常浏览器安装扩展、登录 ChatGPT，再返回设置页连接账号。</p><div class="notice">本原型不打开真实登录，不读取浏览器 Cookie。</div><p>扩展状态：${state.extensionInstalled?'已安装（模拟）':'尚未安装'}</p><div class="actions">${!state.extensionInstalled?button('install-extension','模拟已安装扩展'):button('connect-account','模拟账号已连接',true)}</div>`],
      tunnel:['演示：OpenAI Tunnels',`<p>在与 ChatGPT 相同的 OpenAI 账号下创建或选择 Tunnel，然后复制其 ID。</p><div class="field"><label>演示 Tunnel ID</label><input readonly value="tunnel_demo_workspace"></div>${button('prepare-tunnel','使用演示 Tunnel',true)}`],
      key:['演示：创建普通 API key',`<p>选择普通 API key，不是 Admin key；需要 Tunnels Read + Use 权限。</p><div class="notice">这里只模拟“凭证已准备”，没有可用密钥，也不接收真实密钥。</div>${button('prepare-key','模拟 API key 已准备',true)}`],
      connector:['演示：ChatGPT 工具授权',`<p>Developer Mode → 新建连接器 → Tunnel → 选择运行中的 Tunnel。</p><div class="notice">名称：<strong>Codex Native2</strong><br>Authentication：<strong>None</strong><br>Permissions：<strong>Allow all actions</strong></div><p>需要理解权限，且工作区策略允许。连接账号的扩展不代替此授权。</p>${state.workspaceBlocked?'<p class="notice error">当前演示场景不允许授权。返回后联系工作区管理员，或在原型控制台解除模拟限制。</p>':button('authorize','模拟已完成授权',true)}`],
      restart:['手动重启的位置',`<p>回到 CodexHub → ChatGPT 服务 → 高级操作。</p><ol><li>停止 ChatGPT 组件。</li><li>重新启动 ChatGPT 组件。</li><li>返回本页，点击“重新检查组件状态”。</li></ol><div class="notice">保存立即结束，不会等待、排队或自动执行重启。</div>${button('close-dialog','知道了',true)}`]
    }[kind];$('dialog-title').textContent=copy[0];$('dialog-body').innerHTML=copy[1];if(!$('outside-dialog').open)$('outside-dialog').showModal();
  }
  function advance(){step=firstPending();render();}
  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||target.disabled)return;
    if(target.dataset.step!==undefined){step=Number(target.dataset.step);toast='';render();return;}
    const action=target.dataset.action;
    if(action==='previous-variant')return switchVariant(-1);if(action==='next-variant')return switchVariant(1);
    if(action==='lab'){labOpen=!labOpen;render();return;}if(action==='reset')return reset(scenario);
    if(action==='close-dialog'){$('outside-dialog').close();return;}
    if(action==='account-dialog')return openDialog('account');if(action==='tunnel-dialog')return openDialog('tunnel');if(action==='key-dialog')return openDialog('key');if(action==='connector-dialog')return openDialog('connector');if(action==='restart-help')return openDialog('restart');
    if(action==='install-extension'){state.extensionInstalled=true;openDialog('account');render();return;}
    if(action==='connect-account'){Object.assign(state,{accountConnected:true,fullRuntimeRunning:false,manualRestartSimulated:false,connectorAuthorized:false,toolRoundtrip:'not-run'});toast='演示：账号已连接。后续仍需启用工具通道并验证。';$('outside-dialog').close();advance();return;}
    if(action==='prepare-tunnel'||action==='prepare-key'){state[action==='prepare-tunnel'?'tunnelPrepared':'apiKeyPrepared']=true;$('outside-dialog').close();render();return;}
    if(action==='save'){Object.assign(state,{credentialsSaved:true,fullRuntimeRunning:false,manualRestartSimulated:false,connectorAuthorized:false,toolRoundtrip:'not-run'});toast='演示：配置已保存。请手动重启 ChatGPT 组件；没有自动重启。';advance();return;}
    if(action==='simulate-restart'){state.manualRestartSimulated=true;toast='演示：用户已在 CodexHub 手动重启。现在可以重新检查组件状态。';render();return;}
    if(action==='check-runtime'){if(!state.manualRestartSimulated){toast='尚未确认新配置已生效。请先在 CodexHub 手动重启 ChatGPT 组件。';render();return;}state.fullRuntimeRunning=true;toast='演示：工具通道已运行，可以去 ChatGPT 添加连接器。';advance();return;}
    if(action==='authorize'){if(state.workspaceBlocked)return;state.connectorAuthorized=true;state.toolRoundtrip='not-run';toast='演示：授权已完成。还需验证工具往返，才能结束设置。';$('outside-dialog').close();advance();return;}
    if(action==='verify'){busy=true;state.toolRoundtrip='checking';toast='正在模拟工具请求与结果往返…';render();probeTimer=setTimeout(()=>{busy=false;state.toolRoundtrip=failProbe?'failed':'passed';toast=failProbe?'演示验证失败：没有降级为文本成功。':'演示验证通过；这不是实际账号或工具验收结果。';advance();},650);return;}
    if(action==='unblock'){state.workspaceBlocked=false;toast='原型控制：已解除模拟工作区限制。';render();return;}
    if(action==='return-auth'){step=3;render();return;}if(action==='back'){step=Math.max(0,step-1);render();return;}if(action==='next'){step=Math.min(4,step+1);render();return;}if(action==='review'){step=0;render();return;}
    if(action==='return-app'){toast='演示结束：实际产品将在此返回 CodexHub 选择模型和客户端。没有操作任何真实应用。';render();}
  });
  document.addEventListener('change',event=>{if(event.target.id==='variant')setVariant(event.target.value);if(event.target.id==='scenario')reset(event.target.value);if(event.target.id==='probe-outcome'){failProbe=event.target.value==='fail';render();}});
  document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]')||$('outside-dialog').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowRight'?1:-1);}});
  reset('existing');
})();
</script>
</body></html>
