<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT Coding Setup</title>
<style nonce="__CODEXHUB_CSP_NONCE__">
:root{color-scheme:light;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f6f7f5;--panel:#fff;--line:#dde3de;--muted:#68746d;--accent:#16704c;--ink:#1c2c23;--warn:#976520;--deep:#244d34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;transition:background .15s,box-shadow .15s}
button:hover:not(:disabled){background:#f0f4ed}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 2px 3px #15332115;font-weight:650}
button.primary:hover:not(:disabled){background:#163c27}button.primary:disabled{background:#e6ebe3;border-color:#e6ebe3;color:#889682;opacity:1}
button.ghost{border:none;padding:3px 0;color:#667a5c;background:none}
a{color:var(--accent)}p{margin:8px 0;color:var(--muted)}h1,h2{margin:0;line-height:1.35}.hidden{display:none!important}
.studio-topbar{height:74px;border-bottom:1px solid #e3e7e2;display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1180px)/2));background:#fafbf9}
.studio-brand{display:flex;align-items:center;gap:10px;font-weight:720;font-size:17px;letter-spacing:-.5px}
.studio-brand img{width:30px;height:30px}.studio-brand span{font-size:12px;font-weight:450;color:#778278;border-left:1px solid #d8ded7;padding-left:14px;margin-left:7px}
.studio-status{display:flex;align-items:center;gap:7px;color:#65746a;font-size:12px}.studio-status i{width:6px;height:6px;border-radius:50%;background:#37835c;display:inline-block}.studio-status b{font-weight:500;color:#24382a}
.studio-shell{max-width:808px;margin:auto;padding:34px 24px 80px}
.studio-intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px;gap:16px}
.studio-intro h1{font-size:30px;letter-spacing:-1.3px;font-weight:680;margin:0 0 7px}.studio-intro p{margin:0;font-size:13px;color:#788279}
.studio-kicker{color:#7d8c7f;font-size:10px;letter-spacing:2px;font-weight:600;margin-bottom:9px}
.studio-progress{font:11px ui-monospace,Consolas,monospace;white-space:nowrap;color:#7b887e}.studio-progress strong{font-size:19px;font-weight:450;color:#324a39}
.studio-steps{display:flex;margin:0 0 28px}.studio-steps button{position:relative;flex:1;min-width:0;border:none;padding:0;background:none;color:#79847c;font-size:12px;display:flex;align-items:center;gap:9px;text-align:left;white-space:nowrap}
.studio-steps button::after{content:"";height:1px;background:#dbe1db;flex:1;margin:0 12px 0 3px}.studio-steps button:last-child{flex:0 0 auto}.studio-steps button:last-child::after{display:none}
.studio-steps .step-dot{width:25px;height:25px;display:grid;place-items:center;border:1px solid #d6ddd5;border-radius:50%;font:11px ui-monospace,monospace;flex-shrink:0;background:#f6f7f5}
.studio-steps .is-done{color:#3c6f50}.studio-steps .is-done .step-dot{background:#e4eee3;border-color:#e4eee3}
.studio-steps .is-current{color:#213c2a;font-weight:650}.studio-steps .is-current .step-dot{background:#203c2b;color:#fff;border-color:#203c2b;box-shadow:0 0 0 4px #e5ece2}
.studio-steps button:disabled{color:#9aa29b;cursor:default}
.studio-sheet{border:1px solid #dfe5dc;background:#fff;border-radius:18px;box-shadow:0 4px 8px #24352403,0 22px 55px -32px #24352430;overflow:hidden}
.studio-sheet-head{display:flex;align-items:center;gap:16px;padding:25px 32px;background:#fbfcfa;border-bottom:1px solid #edf0e9}
.service-symbol{width:49px;height:49px;display:grid;place-items:center;border-radius:14px;background:#e9eee5;border:1px solid #e1e8dc;flex-shrink:0}.service-symbol img{width:27px;height:27px}
.service-name{font-weight:650;font-size:16px}.service-caption{font-size:11px;color:#7b867b;margin-top:1px}
.sheet-step{margin-left:auto;font:10px ui-monospace,Consolas,monospace;color:#71836e;border:1px solid #dce5d6;background:#f2f5ec;border-radius:5px;padding:5px 8px;white-space:nowrap}
.studio-content{padding:27px 32px 28px}.studio-content h2{font-size:24px;letter-spacing:-.8px;font-weight:650;margin:0 0 8px}.studio-content p{font-size:13px;line-height:1.8;max-width:570px}
.place{font-size:11px;color:#66866b;margin-bottom:13px}
.notice{border:none;background:#eef5ec;color:#496542;border-radius:10px;font-size:13px;padding:12px 15px;margin:16px 0}
.notice.warn{background:#fbf4e6;color:#87682a}.notice.error{background:#fff0ed;color:#974b3f}.notice.success{background:#e7f1df;color:#496339}
.toast{background:#e7f1df;color:#496339;border:1px solid #d3e4c8;font-size:12px;padding:12px 15px;border-radius:10px;margin-bottom:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.connection-line{display:flex;align-items:center;gap:10px;margin:20px 0 23px;padding:11px 14px;border:1px solid #e6ebdf;border-radius:8px;background:#fafcf7;font-size:11px;color:#667663}
.connection-line .endpoint{display:flex;gap:6px;align-items:center;color:#3b553e;font-weight:550}.connection-line img{width:15px;height:15px}
.connection-line .wire{flex:1;height:1px;background:#d2ddc9;position:relative;min-width:18px}.connection-line .wire::after{content:"";width:5px;height:5px;background:#9eb08f;border-radius:50%;position:absolute;right:0;top:-2px}
.credential-block{margin:19px 0 0}.credential-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.credential-label label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}.credential-label .index{font:10px ui-monospace,monospace;color:#839178}
.credential-input{position:relative}.credential-input input{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;width:100%;padding:13px 42px 13px 14px;background:#fbfcf9;border:1px solid #dce3d6;border-radius:8px;color:#36503a;outline:none}
.credential-input .input-symbol{position:absolute;right:14px;top:11px;color:#8ba17c;font-size:16px}
.credential-block p{font-size:12px;color:#707d67;margin-top:6px}.credential-block.is-ready input{border-color:#adc69c;background:#f9fcf5}.credential-block.is-ready .input-symbol{color:#518147}
.studio-bottom{border-top:1px solid #e9ede4;margin-top:25px;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.studio-bottom p{font-size:11px;line-height:1.65;margin:0;color:#8a9382}.studio-bottom p strong{color:#596b50;font-weight:500}.studio-bottom button{white-space:nowrap;min-height:41px}
.studio-footer{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;color:#8a9485;font-size:11px;gap:15px}
.completed{padding:35px 0;text-align:center}.completed .checkmark{font-size:38px;color:#43733a}.completed .badge{display:inline-block;padding:3px 9px;border-radius:20px;background:#edf4e7;color:#527a44;font-size:12px;margin:10px 0}.completed h1{font-size:28px;margin:10px 0}
ol.recipe{padding-left:22px;color:var(--muted);font-size:13px}ol.recipe li+li{margin-top:8px}
details.advanced{margin-top:22px;border-top:1px solid #edf0e9;padding-top:14px}details.advanced summary{cursor:pointer;color:#667a5c;font-size:12px;font-weight:600}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:600}.field input[type=number]{padding:10px 12px;border:1px solid #dce3d6;border-radius:8px;background:#fafbf8}
.check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#546456;margin:8px 0}
.session-gate{max-width:640px;margin:60px auto;padding:28px;border:1px solid var(--line);border-radius:16px;background:#fff}
.linkish{border:none;padding:2px 0;color:#4d7350;font-size:11px;background:none;text-decoration:none}
:is(button,input,a,summary):focus-visible{outline:2px solid #538745;outline-offset:4px}
@media(prefers-reduced-motion:no-preference){.studio-sheet{animation:sheet-in .24s ease-out}@keyframes sheet-in{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:none}}}
@media(max-width:600px){.studio-topbar{height:60px;padding:0 20px}.studio-brand span{display:none}.studio-shell{padding:25px 16px 70px}.studio-intro h1{font-size:26px}.studio-progress{display:none}
.studio-steps button{flex-direction:column;gap:7px;font-size:10px;flex:1!important}.studio-steps button::after{position:absolute;top:12px;left:calc(50% + 18px);width:calc(100% - 36px);margin:0}
.studio-steps button>span:last-child{min-width:0;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.25}
.studio-sheet-head,.studio-content{padding-left:20px;padding-right:20px}.studio-content h2{font-size:21px}.studio-bottom{flex-direction:column;align-items:stretch}.studio-bottom button{width:100%}.adv-grid{grid-template-columns:1fr}}
</style>
</head>

      byId("session-needed").classList.remove("hidden");
      byId("app").classList.add("hidden");
      throw new Error(text.sessionExpired);

        ${active ? `<div class="notice success">${esc(text.runtimeReady)}</div>` : `<div class="notice warn">${esc(text.activateWarn)}</div><p>${esc(text.activateP)}</p><p><small>${esc(text.restartHelp)}</small></p><div class="notice">${esc(text.runtimePending)}</div>`}
        <div class="actions">
          ${active ? `<button type="button" data-action="continue" class="primary"${busy?" disabled":""}>${esc(text.continueLabel)} →</button>` : `<button type="button" data-action="recheck-runtime" class="primary"${busy?" disabled":""}>${esc(text.recheckRuntime)}</button>`}
        </div>`;
    }
    if (step === 3) {
      const ok = connectorOk(data);
      return `<div class="place">${esc(text.placeAuthorize)}</div><h2>${esc(text.authorizeH2)}</h2><p>${esc(text.authorizeP)}</p>
        <ol class="recipe"><li>${esc(text.recipe1)}</li><li>${esc(text.recipe2)}</li><li>${esc(text.recipe3)}</li><li>${esc(text.recipe4)}</li></ol>
        <p><small>${esc(text.recipeNote)}</small></p>
        ${ok ? `<div class="notice success">${esc(text.connectorReady)}</div>` : `<div class="notice">${esc(text.connectorBlocked)}</div>`}
        <div class="actions">
          <a href="https://chatgpt.com/#settings/Connectors" target="_blank" rel="noopener noreferrer"><button type="button">${esc(text.openConnector)}</button></a>
          <button type="button" data-action="recheck-connector" class="primary"${busy?" disabled":""}>${esc(text.recheckConnector)}</button>
          ${ok ? `<button type="button" data-action="continue"${busy?" disabled":""}>${esc(text.continueLabel)} →</button>` : ""}
        </div>`;
    }
    return `<div class="place">${esc(text.placeVerify)}</div><h2>${esc(text.verifyH2)}</h2><p>${esc(text.verifyP)}</p>
      <div class="notice">${esc(text.verifyNote)}</div>
      ${probe.state === "failed" || probe.state === "blocked" || probe.state === "stale" ? `<div class="notice error">${esc(verifyFailureMessage(probe.reason))}</div>` : ""}
      ${probe.state === "unavailable" ? `<div class="notice warn">${esc(text.verifyUnavailable)}</div>` : ""}
      <div class="actions">
        <button type="button" data-action="verify" class="primary"${busy||probe.state==="running"?" disabled":""}>${esc(probe.state==="running"?text.verifyRunning:text.verifyRun)}</button>
        <button type="button" data-action="goto-auth"${busy?" disabled":""}>${esc(text.returnAuth)}</button>
      </div>`;
  };

  function render() {
    const data = current || { runtime: {}, readiness: {}, settings: {} };
    const pending = firstPending(data);
    const view = Math.min(step, 5);
    const toastHtml = toast ? `<div class="toast notice ${toastKind==="error"?"error":toastKind==="warn"?"warn":"success"}" role="status">${esc(toast)}</div>` : "";
    const nav = text.steps.map((title, i) => {
      const done = completed(i, data);
      const currentStep = view === i;
      return `<button type="button" data-step="${i}" class="${done?"is-done":""} ${currentStep?"is-current":""}" ${currentStep?'aria-current="step"':""}${i>pending?" disabled":""}><span class="step-dot">${done?"✓":i+1}</span><span>${esc(title)}</span></button>`;
    }).join("");
    const sheetCode = view === 5 ? "READY" : `${String(view+1).padStart(2,"0")} / ${text.sheetCodes[view]}`;
    byId("app").innerHTML = `
      <header class="studio-topbar">
        <div class="studio-brand"><img src="${CODEX_MARK}" alt="">CodexHub<span>${esc(text.brandSub)}</span></div>
        <div class="studio-status"><i></i><b>${esc(text.localStatus)}</b></div>
      </header>
      <div class="studio-shell">
        <div class="studio-intro"><div><div class="studio-kicker">${esc(text.kicker)}</div><h1>${esc(text.title)}</h1><p>${esc(text.subtitle)}</p></div>
          <div class="studio-progress"><strong>${String(Math.min(view+1,5)).padStart(2,"0")}</strong> / 05</div></div>
        <nav class="studio-steps" aria-label="Setup progress">${nav}</nav>
        ${toastHtml}
        <section class="studio-sheet">
          <div class="studio-sheet-head">
            <div class="service-symbol"><img src="${OPENAI_MARK}" alt="ChatGPT"></div>
            <div><div class="service-name">${esc(text.serviceName)}</div><div class="service-caption">${esc(text.serviceCaption)}</div></div>
            <span class="sheet-step">${esc(sheetCode)}</span>
          </div>
          <div class="studio-content">${stepContent(data)}</div>
        </section>
        <footer class="studio-footer">
          <span>${esc(text.footerNote)}</span>
          ${view>0 && view<5 ? `<button type="button" class="ghost" data-action="back"${busy?" disabled":""}>${esc(text.back)}</button>` : `<span>${esc(text.footerBrand)}</span>`}
        </footer>
      </div>`;
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest("button");
    if (!target || target.disabled) return;
    if (target.dataset.step !== undefined) {
      const next = Number(target.dataset.step);
      if (Number.isFinite(next) && next <= firstPending(current || {})) {
        captureForm(); step = next; toast = ""; render();
      }
      return;
    }
    const action = target.dataset.action;
    if (!action) return;
    if (action === "back") { captureForm(); step = Math.max(0, step - 1); toast = ""; render(); return; }
    if (action === "continue") { captureForm(); step = Math.min(4, Math.max(step, firstPending(current || {}))); if (completed(step, current||{})) step = firstPending(current||{}); toast=""; render(); return; }
    if (action === "review") { step = 0; toast = ""; render(); return; }
    if (action === "goto-auth") { step = 3; toast = ""; render(); return; }
    if (action === "extension") { void downloadExtension(); return; }
    if (action === "open-chatgpt") { window.open("https://chatgpt.com/", "_blank", "noopener,noreferrer"); return; }
    if (action === "save") { void save(false); return; }
    if (action === "disable-unsupported") { void save(true); return; }
    if (action === "recheck-runtime") { void recheckRuntime(); return; }
    if (action === "recheck-connector") { void recheckConnector(); return; }
    if (action === "verify") { void verifyCoding(); return; }
  });
  document.addEventListener("change", (event) => {
    if (event.target && event.target.id === "clear-key") {
      form.clear_key = event.target.checked;
      const key = byId("focus-key");
      if (key) key.disabled = form.clear_key || busy;
    }
  });
  window.addEventListener("codexhub-browser-account", (event) => {
    const phase = event.detail?.phase;
    if (!["verifying", "saved", "failed"].includes(phase)) return;
    if (phase === "verifying") { busy = true; showToast(text.browserVerifying, "info"); render(); return; }
    busy = false;
    showToast(phase === "saved" ? text.browserSaved : text.browserFailed, phase === "failed" ? "error" : "success");
    void refresh(false).then(() => {
      if (phase === "saved") step = firstPending(current || {});
      render();
    }).catch(() => render());
  });

  const start = async () => {
    const key = "codexhub.runtime-settings.session";
    const exchangeBootstrap = async () => {
      const result = await request("/api/session", "POST", { bootstrap });
      sessionStorage.setItem(key, result.session);
      bootstrap = "";
    };
    try {
      if (sessionStorage.getItem(key)) {
        try { await refresh(true); }
        catch (error) {
          if (!bootstrap || sessionStorage.getItem(key)) throw error;
          await exchangeBootstrap();
          await refresh(true);
        }
      } else if (bootstrap) {
        await exchangeBootstrap();
        await refresh(true);
      } else {
        throw new Error(text.sessionExpired);
      }
      byId("session-needed").classList.add("hidden");
      byId("app").classList.remove("hidden");
      render();
      timer = window.setInterval(() => { if (!busy) void refresh(false).catch(() => {}); }, 30000);
    } catch (error) {
      byId("session-needed").classList.remove("hidden");
      byId("app").classList.add("hidden");
      byId("session-needed").insertAdjacentHTML("beforeend", `<p class="notice error">${esc(error.message || text.sessionExpired)}</p>`);
    }
  };
  window.addEventListener("pagehide", () => { if (timer) clearInterval(timer); });
  void start();
})();

</script>
</body>
</html>
