[[providers]]
id = "ollama-cloud"
name = "Ollama Cloud"
base_url = "https://ollama.com/v1"
api_key = "{env:OLLAMA_API_KEY}"
display_prefix = "Ollama"
upstream_format = "responses"
available_upstream_formats = ["responses"]
# Set true only when an external provider returns truthful cached-input-token counts.
reports_cached_input_tokens = false
sort_order = 1
enabled = true

  [[providers.models]]
  id = "minimax-m3"
  display_name = "Ollama MiniMax-M3"
  context_window = 512000
  max_output_tokens = 524288
  sort_order = 1
  enabled = true

  [[providers.models]]
  id = "glm-5.2"
  display_name = "Ollama GLM-5.2"
  context_window = 1000000
  max_output_tokens = 131072
  sort_order = 2
  enabled = true
  tool_surface_strategy = "deferred_core"
  native_responses_tool_codec = "strict_apply_patch"
  multi_agent_version = "v2"

  [[providers.models]]
  id = "kimi-k2.7-code"
  display_name = "Ollama Kimi K2.7 Code"
  context_window = 262144
  max_output_tokens = 32768
  sort_order = 3
  enabled = true

